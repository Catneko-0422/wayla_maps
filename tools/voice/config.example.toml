# Copy to config.toml (gitignored) and fill in.

# "api_v2" for a GPT-SoVITS api_v2.py server, "openai" for POST /v1/audio/speech.
backend = "api_v2"
server_url = "http://127.0.0.1:9880"

# backend = "openai"
# server_url = "http://192.168.0.101:8000"
# api_key_env = "WAYLA_TTS_API_KEY"   # the key is read from this environment variable

# Languages to generate. English prompts fall back to system TTS until "en" is added here.
languages = ["zh-TW"]

timeout_seconds = 120

# Merged into every POST /tts request. See api_v2.py for the full list.
[params]
top_k = 5
top_p = 1.0
temperature = 1.0
speed_factor = 1.0
text_split_method = "cut0"   # fragments are short; do not split them further

# Leading/trailing silence is cut so concatenated fragments do not drag.
[trim]
threshold = 0.02   # fraction of full scale below which audio counts as silence
keep_ms = 60       # silence kept on each side

[voice."zh-TW"]
text_lang = "zh"
ref_audio_path = "/path/on/the/server/reference.wav"   # path as the server sees it
prompt_text = "參考音檔裡說的話"
prompt_lang = "zh"

# With backend = "openai" a voice is just a name and a language:
# [voice."zh-TW"]
# voice = "stylet"
# language = "zh"

# [voice.en]
# text_lang = "en"
# ref_audio_path = "/path/on/the/server/reference_en.wav"
# prompt_text = "What the reference clip says."
# prompt_lang = "en"
